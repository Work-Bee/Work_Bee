<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Job Portal - Find the perfect unskilled job opportunities"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>WorkBee - Find Your Dream Job</title>
    <style>
      /* Loading Screen Styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }

      #loading-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      .loader-container {
        text-align: center;
      }

      /* WorkBee Logo Animation */
      .logo-text {
        font-size: 3.5rem;
        font-weight: 800;
        color: white;
        letter-spacing: 2px;
        margin-bottom: 2rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }

      .logo-text span {
        display: inline-block;
        animation: wave 1.5s ease-in-out infinite;
        animation-delay: calc(0.1s * var(--i));
      }

      @keyframes wave {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      /* Bee Animation */
      .bee-container {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 2rem;
      }

      .bee {
        width: 60px;
        height: 40px;
        background: linear-gradient(to bottom, #ffd700 0%, #ffd700 45%, #000 45%, #000 55%, #ffd700 55%, #ffd700 100%);
        border-radius: 50%;
        position: relative;
        animation: fly 2s ease-in-out infinite;
      }

      .bee::before {
        content: '';
        position: absolute;
        top: 10px;
        left: -15px;
        width: 30px;
        height: 20px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: wingFlap 0.2s ease-in-out infinite;
      }

      .bee::after {
        content: '';
        position: absolute;
        top: 10px;
        right: -15px;
        width: 30px;
        height: 20px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: wingFlap 0.2s ease-in-out infinite;
        animation-delay: 0.1s;
      }

      @keyframes fly {
        0%, 100% {
          transform: translateY(0) rotate(-5deg);
        }
        50% {
          transform: translateY(-15px) rotate(5deg);
        }
      }

      @keyframes wingFlap {
        0%, 100% {
          transform: scaleX(1) scaleY(1);
        }
        50% {
          transform: scaleX(1.3) scaleY(0.8);
        }
      }

      /* Loading Dots */
      .loading-dots {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 12px;
        height: 12px;
        background: white;
        border-radius: 50%;
        animation: bounce 1.4s ease-in-out infinite;
      }

      .dot:nth-child(1) {
        animation-delay: 0s;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%, 80%, 100% {
          transform: scale(0.8);
          opacity: 0.5;
        }
        40% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      /* Loading Text */
      .loading-text {
        color: white;
        font-size: 1.2rem;
        margin-top: 2rem;
        font-weight: 500;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loader-container">
        <div class="bee-container">
          <div class="bee"></div>
        </div>
        <div class="logo-text">
          <span style="--i: 0">W</span>
          <span style="--i: 1">o</span>
          <span style="--i: 2">r</span>
          <span style="--i: 3">k</span>
          <span style="--i: 4">B</span>
          <span style="--i: 5">e</span>
          <span style="--i: 6">e</span>
        </div>
        <div class="loading-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <p class="loading-text">Finding opportunities...</p>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Hide loading screen when React app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('fade-out');
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 800); // Show for at least 800ms
      });
    </script>
  </body>
</html>
